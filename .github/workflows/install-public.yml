name: install-public

# runs the one-line installers from the README against the published repository
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  one-liner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Install (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/sagol/mdbindery/main/install/install.sh | bash
          ~/.local/bin/mdbindery doctor
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/sagol/mdbindery/main/install/install.ps1 | iex
          & "$env:USERPROFILE\.local\bin\mdbindery.exe" doctor
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Quick start on the sample book
        shell: bash
        run: |
          git clone -q https://github.com/sagol/mdbindery
          cd mdbindery/examples/sample-book
          export PATH="$HOME/.local/bin:$USERPROFILE/.local/bin:$PATH"
          mdbindery check . --build
          mdbindery build
